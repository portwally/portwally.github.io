<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<script>
  // Addresses typed by hand in other capitals: Conquer GS's quit screen
  // shows PORTWALLY.GITHUB.IO/CONQUER-GS (its font has only capitals)
  (function () {
    var p = location.pathname.toLowerCase().replace(/\/index\.html$/, '').replace(/\/+$/, '');
    var to = { '/conquer-gs': '/Conquer-GS/' }[p];
    if (to) location.replace(to + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0066cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f5f5f7; --muted: #a1a1a6; --link: #4da3ff; }
  }
  body { margin: 0; padding: 4rem 1rem; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>This page doesn't exist. <a href="/">Back to the home page</a></p>
</body>
</html>
